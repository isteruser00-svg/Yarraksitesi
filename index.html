<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seni Seviyorum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .heart {
            font-size: 60px;
            color: #ff4757;
            animation: pulse 1.2s infinite;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        h1 {
            color: #2f3542;
            margin-bottom: 15px;
            font-size: 26px;
        }

        p {
            color: #57606f;
            font-size: 16px;
            line-height: 1.6;
        }

        /* Arka plan için yüzen kalpler efekti */
        .bg-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            animation: floatUp 6s linear infinite;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Arka plan yüzen kalpleri -->
    <div class="bg-heart" style="left: 10%; animation-delay: 0s;">❤️</div>
    <div class="bg-heart" style="left: 30%; animation-delay: 2s;">💖</div>
    <div class="bg-heart" style="left: 50%; animation-delay: 4s;">❤️</div>
    <div class="bg-heart" style="left: 70%; animation-delay: 1s;">💓</div>
    <div class="bg-heart" style="left: 90%; animation-delay: 3s;">❤️</div>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>İyi ki Varsın!</h1>
        <p>Dünyanın en güzel ve en özel kalbine sahip olan sana, hayatımı güzelleştirdiğin için çok teşekkür ederim. Seni çok seviyorum.</p>
    </div>

</body>
</html>
